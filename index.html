<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Basketball Hoops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1b1040; color: #fff4e6;
  font-family: "Press Start 2P", ui-monospace, Menlo, monospace;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.scr { position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: none; }
.scr.on { display: flex; }
button { font-family: inherit; }

/* ––––– title screen + board selector ––––– */
#scrTitle { flex-direction: column; align-items: center; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 18px); }
.logo { font-weight: 400; text-align: center; color: #f8b800; font-size: clamp(24px, 6vw, 52px); line-height: 1.3; margin: 12px 0 8px;
  text-shadow: 3px 3px 0 #d82800, 6px 6px 0 #000; }
.sub { color: #58d8c0; font-size: 10px; margin: 4px 0 22px; text-align: center; line-height: 1.6; }
.boards { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 980px; }
.board { flex: 1 1 260px; max-width: 310px; background: #26185a; border: 3px solid #000; box-shadow: inset 0 0 0 2px #3d2a80; border-radius: 12px;
  padding: 10px; cursor: pointer; text-align: center; color: inherit; }
.board.sel { box-shadow: inset 0 0 0 2px #3d2a80, 0 0 0 4px #f8d800; }
.board canvas { width: 100%; aspect-ratio: 16 / 9; image-rendering: pixelated; display: block; border: 3px solid #000; border-radius: 6px; background: #000; }
.bNum { color: #f87800; font-size: 10px; margin: 12px 0 8px; }
.bName { color: #fcfcfc; font-size: 13px; line-height: 1.5; }
.bSub { color: #c9b8ff; font-size: 8px; line-height: 1.8; margin-top: 8px; min-height: 3.6em; }
.bBest { color: #f8d878; font-size: 9px; margin-top: 8px; }
.bPlay { display: inline-block; margin-top: 10px; font-size: 11px; padding: 10px 16px; background: #d82800; color: #fff; border: 3px solid #000;
  border-radius: 8px; box-shadow: inset -3px -3px 0 #8a1800; }
.board.sel .bPlay { background: #1f9a50; box-shadow: inset -3px -3px 0 #0e5a2a; }
.help { color: #8a78c8; font-size: 8px; line-height: 2.2; text-align: center; margin-top: 18px; }

/* ––––– the game ––––– */
#scrGame { flex-direction: column; background: #000; touch-action: none; }
#hud { flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: calc(env(safe-area-inset-top) + 6px) 10px 7px; font-size: 10px; color: #f8d878; background: #120a30; border-bottom: 3px solid #000; }
#hBalls { display: flex; gap: 3px; min-width: 20px; }
.bi { width: 13px; height: 13px; border-radius: 50%; background: #f07818; border: 2px solid #000; }
.bi.k1 { background: conic-gradient(#e83020 0 25%, #fcfcfc 0 50%, #2060e0 0 75%, #f8d800 0); }
.bi.k2 { background: #f8d030; }
#hInfo { flex: 1; text-align: center; color: #58f8d0; }
#hScore { color: #fcfcfc; }
#hPause { font-size: 10px; background: #2a1c60; color: #e6dcff; border: 2px solid #4a3696; border-radius: 6px; padding: 6px 8px; cursor: pointer; }
#stage { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
#cv { display: block; image-rendering: pixelated; }
#panel { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .8em;
  background: rgba(0,0,0,.66); text-align: center; font-size: clamp(9px, 1.6vw, 14px); line-height: 1.7; padding: 10px; overflow-y: auto; }
#panel.hide { display: none; }
#panel h1 { margin: 0; font-size: 2.2em; line-height: 1.2; color: #f8b800; text-shadow: 3px 3px 0 #d82800, 5px 5px 0 #000; font-weight: 400; }
#panel p { margin: 0; text-shadow: 2px 2px 0 #000; }
#panel .bn { color: #f87800; }
#panel .how { color: #cfcfcf; max-width: 46em; }
#panel .tip { color: #8fd0ff; font-size: .8em; }
#panel .row { display: flex; flex-wrap: wrap; justify-content: center; gap: .6em; }
#panel button { font-size: 1.1em; padding: .75em 1.3em; background: #d82800; color: #fcfcfc; border: 3px solid #000;
  box-shadow: inset -3px -3px 0 #8a1800; cursor: pointer; }
#panel button.sm { font-size: .8em; padding: .6em .8em; background: #bdbdbd; color: #000; box-shadow: inset -3px -3px 0 #8e8e8e; }
#panel button.sel { outline: 3px solid #f8b800; outline-offset: 2px; }

/* ––––– on-screen controller (phones and tablets) ––––– */
#pad { display: none; flex-shrink: 0; align-items: center; justify-content: space-between; padding: 10px 20px calc(env(safe-area-inset-bottom) + 14px);
  background: #c4c0b8; border-top: 4px solid #8a8680; min-height: 190px; }
body.touch #pad { display: flex; }
#dpad { position: relative; width: 156px; height: 156px; touch-action: none; flex-shrink: 0; }
.dpH { position: absolute; left: 0; right: 0; top: 52px; height: 52px; background: #232323; border-radius: 6px; }
.dpV { position: absolute; top: 0; bottom: 0; left: 52px; width: 52px; background: #232323; border-radius: 6px; }
.dpA { position: absolute; color: #6a6a6a; font-size: 18px; width: 52px; height: 52px; display: flex; align-items: center; justify-content: center; pointer-events: none; }
.dpA.u { left: 52px; top: 0; }
.dpA.d { left: 52px; bottom: 0; }
.dpA.l { left: 0; top: 52px; }
.dpA.r { right: 0; top: 52px; }
.dpA.on { color: #f8d800; }
#abWrap { display: flex; gap: 16px; align-items: flex-end; }
.pb { width: 78px; height: 78px; border-radius: 50%; background: #d82800; border: 4px solid #000; box-shadow: inset -5px -5px 0 #8a1800;
  display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; touch-action: none; }
.pb b { font-size: 20px; font-weight: 400; pointer-events: none; }
.pb i { font-style: normal; font-size: 7px; margin-top: 5px; pointer-events: none; }
.pb.on { box-shadow: inset 5px 5px 0 #8a1800; background: #b02000; }
#btnA { margin-bottom: 30px; }
body.land #pad { position: absolute; left: 0; right: 0; bottom: 0; background: transparent; border: none; min-height: 0; pointer-events: none;
  padding-bottom: calc(env(safe-area-inset-bottom) + 10px); }
body.land #pad > * { pointer-events: auto; opacity: .78; }
body.touch:not(.land) #stage { flex: none; }
body.touch:not(.land) #pad { flex: 1; }
</style>
</head>
<body>

<!-- ================= TITLE: pick a board ================= -->
<div class="scr" id="scrTitle">
  <h1 class="logo">BASKETBALL<br>HOOPS</h1>
  <div class="sub">PICK A BOARD</div>
  <div class="boards" id="boards"></div>
  <div class="help" id="help"></div>
</div>

<!-- ================= THE GAME ================= -->
<div class="scr" id="scrGame">
  <div id="hud"><span id="hBalls"></span><span id="hScore">0</span><span id="hInfo"></span><span id="hTime"></span><button type="button" id="hPause">II</button></div>
  <div id="stage"><canvas id="cv"></canvas><div id="panel" class="hide"></div></div>
  <div id="pad">
    <div id="dpad"><div class="dpH"></div><div class="dpV"></div>
      <span class="dpA u" id="dpU">&#9650;</span><span class="dpA d" id="dpD">&#9660;</span><span class="dpA l" id="dpL">&#9664;</span><span class="dpA r" id="dpR">&#9654;</span></div>
    <div id="abWrap">
      <div class="pb" id="btnB"><b>B</b><i>SHOOT</i></div>
      <div class="pb" id="btnA"><b>A</b><i>JUMP</i></div>
    </div>
  </div>
</div>

<script>
'use strict';
/* ============================================================
   BASKETBALL HOOPS
   Board 1: the gym (the Teacherbase Hoops shot, one hoop on the right)
   Board 2: hoops at the beach (Palm Court Hoops from QuizQuest)
   Board 3: in the clouds, wearing the Air Jordann's
============================================================ */

/* ============================================================
   SHARED CONSTANTS
============================================================ */
var W = 256, H = 144, FLOOR = 132;
var BR = 4, BALL_G = 230, ANG = 60 * Math.PI / 180, RIM_W = 19;
var RUN = 80, GRAV = 520, JUMP_V = 230;
var FLOOR_PLAT = { x1: 0, x2: W, y: FLOOR, floor: true, id: 'floor' };
var PLATFORM = { x1: 100, x2: 156, y: 90, id: 'plat' };
var CLOUD_PLATS = [{ x1: 22, x2: 60, y: 108, id: 'c1' }, { x1: 168, x2: 202, y: 112, id: 'c2' }];
var HOOPS = [
  { name: 'LOW',  side: 1,  bx: 240, base: 247, y: 96, pts: 2, ph: 0 },
  { name: 'MIDDLE', side: -1, bx: 12, base: 7, y: 62, pts: 3, ph: 2.1 },
  { name: 'HIGH', side: 1,  bx: 204, base: 211, y: 32, pts: 5, ph: 4.2 }
];
/* make the lit hoops in order (LOW, MIDDLE, HIGH) to open the magic round: the middle platform flashes,
   unlimited jumps and a magic hoop high on the left to slam dunk on */
var MAGIC_HOOP = { bx: 12, y: 26 };
var MAGIC_SECS = 20, DUNK_PTS = 10;
// the super dunk chain (low, middle, high, then the glass hoop) and the magic shot into all four baskets
var CHAIN_PTS = [4, 6, 10, 25], MAGIC_SHOT_PTS = 20, CHAIN_DIR = [-1, 1, -1];
var MAGIC_COLS = ['#f878f8', '#78f8f8', '#f8f878', '#b078ff', '#fcfcfc'];
var CHEERS = ['NICE SHOT!', 'SWEET!', 'NOICE!!', 'BALLER!!', 'BUCKETS!', 'SPLASH!', 'ON FIRE!', 'CASH!', 'MONEY!', 'SWISH!'];
var CHEER_COLS = ['#f8d800', '#58f878', '#58d8f8', '#f878d8', '#f89838', '#c078f8', '#fcfcfc'];
var SKY_PTS = 7, RAIN_HW = 10;
var BEST_KEY = 'basketballHoopsBest_v1', SEL_KEY = 'basketballHoopsBoard_v1';

var SHIRTS = ['#d82800', '#f87800', '#f8d800', '#38b818', '#1fb8a0', '#2858f0', '#8030d0', '#f05898', '#fcfcfc', '#303030'];
var SKINS = ['#fcd8b0', '#f0b880', '#c88850', '#8a5430'];
var HAIRC = ['#202020', '#6a3810', '#f8d878', '#d82800', '#2858f0', '#f05898', '#38b818', '#fcfcfc'];
var HATS = [
  { n: 'SHORT HAIR', r: ['........', '........', '........', '..hhhh..', '..hh....', '........'] },
  { n: 'CAP', r: ['........', '........', '..hhhh..', '..hhhhhh', '........', '........'] },
  { n: 'BACKWARDS CAP', r: ['........', '........', '..hhhh..', 'hhhhhh..', '........', '........'] },
  { n: 'BEANIE', r: ['........', '....w...', '..hhhh..', '.hhhhhh.', '.wwwwww.', '........'] },
  { n: 'AFRO', r: ['........', '..hhhh..', '.hhhhhh.', 'hhhhhhhh', 'hh.....h', 'hh......'] },
  { n: 'SPIKY HAIR', r: ['........', '..h.h.h.', '..hhhhh.', '..hhhhh.', '..h.....', '........'] },
  { n: 'HEADBAND', r: ['........', '........', '........', '..kkkk..', '..hhhhh.', '..k.....'] },
  { n: 'CROWN', r: ['........', '..y.y.y.', '..yyyyy.', '..yryyy.', '..k.....', '........'] },
  { n: 'BOW', r: ['........', '.hh.hh..', '..hhh...', '..kkkk..', '..kk....', '........'] },
  { n: 'MOHAWK', r: ['....h...', '...hhh..', '...hhh..', '...hhh..', '........', '........'] },
  { n: 'LONG HAIR', r: ['........', '........', '..hhhh..', '.hhhhhh.', '.hhh....', '.hh.....', '.hh.....', '.hh.....', '.hh.....', '.h......'] },
  { n: 'PONYTAIL', r: ['........', '........', '..hhhh..', '.hhhhhh.', 'rhhh....', 'h.h.....', 'h.......', 'h.......', '.h......'] },
  { n: 'PIGTAILS', r: ['........', '........', '..hhhh..', 'rhhhhhhr', 'hhh....h', 'h.h....h', 'h......h', '.h......'] }
];
var BODY = ['........', '..sssss.', '..sssEs.', '..sssss.', '...sss..', '.SSSSSS.', 'sSSSSSSs', 's.SSSS.s', '..SSSS..'];
var BODY_UP = ['........', '..sssss.', '..sssEs.', '..sssss.', '...sss..', '.SSSSSS.', '.SSSSSS.', '..SSSS..', '..SSSS..'];
var ARMS = ['.s.....s', '.s.....s', '.s.....s', '.s.....s', '.s.....s', '.s.....s', '.s.....s', '.s.....s'];
var LEGS = [
  ['..P..P..', '..P..P..', '.FF..FF.'],
  ['..P..P..', '.P....P.', 'FF....FF'],
  ['...PP...', '...PP...', '..FFF...']
];
// the player: blue jersey and a red cap, like the Teacherbase Hoops player; on the clouds the red high tops are the Air Jordann's
var LOOK = { shirt: 5, skin: 0, hat: 1, hc: 3, shoe: 0 };
var LOOK_SHOES = { shirt: 5, skin: 0, hat: 1, hc: 3, shoe: 1 };

/* ============================================================
   HELPERS
============================================================ */
function $(id){ return document.getElementById(id); }
function rand(a, b){ return a + Math.random() * (b - a); }
function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
function hyp(x, y){ return Math.sqrt(x * x + y * y); }
function pick(a){ return a[Math.floor(Math.random() * a.length)]; }
function sgn(v){ return v > 0 ? 1 : (v < 0 ? -1 : 0); }
function fmt(s){ s = Math.max(0, Math.ceil(s)); var m = Math.floor(s / 60), r = s % 60; return m + ':' + (r < 10 ? '0' : '') + r; }
function store(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function load(k){ try { var r = localStorage.getItem(k); return r ? JSON.parse(r) : null; } catch (e) { return null; } }
function shade(hex, k){
  var n = parseInt(hex.slice(1), 16);
  function f(v){ return clamp(Math.round(k < 0 ? v * (1 + k) : v + (255 - v) * k), 0, 255); }
  return '#' + [n >> 16, (n >> 8) & 255, n & 255].map(function(v){ var s = f(v).toString(16); return s.length < 2 ? '0' + s : s; }).join('');
}
function isTouch(){ return ('ontouchstart' in window) || (navigator.maxTouchPoints > 0); }

/* ============================================================
   SOUND (synthesized, unlocked on the first key or tap)
============================================================ */
var AC = null;
function ac(){
  if (!AC){ try { var C = window.AudioContext || window.webkitAudioContext; if (C) AC = new C(); } catch (e) {} }
  if (AC && AC.state === 'suspended'){ try { AC.resume(); } catch (e) {} }
  return AC;
}
function tone(f, d, type, vol, slide, delay){
  var a = ac(); if (!a) return;
  type = type || 'square'; vol = vol || 0.06; slide = slide || 0; delay = delay || 0;
  var t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + 0.02);
}
function hiss(d, vol, freq){
  var a = ac(); if (!a) return;
  var n = Math.floor(a.sampleRate * d), buf = a.createBuffer(1, n, a.sampleRate), data = buf.getChannelData(0);
  for (var i = 0; i < n; i++) data[i] = Math.random() * 2 - 1;
  var s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  s.buffer = buf; f.type = 'highpass'; f.frequency.value = freq || 3000;
  g.gain.setValueAtTime(vol || 0.05, a.currentTime); g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + d);
  s.connect(f); f.connect(g); g.connect(a.destination); s.start();
}
var sfx = {
  dribble: function(){ tone(110, 0.05, 'square', 0.035, -40); },
  bounce: function(v){ tone(90, 0.08, 'square', clamp(v, 0.01, 0.06), -30); },
  rim: function(){ tone(700, 0.12, 'triangle', 0.06, -200); },
  board: function(){ tone(160, 0.08, 'square', 0.05); },
  swish: function(){ hiss(0.25, 0.06, 2500); tone(784, 0.1, 'square', 0.04, 0, 0.12); tone(1047, 0.1, 'square', 0.04, 0, 0.2); },
  jump: function(){ tone(300, 0.1, 'square', 0.04, 300); },
  jump2: function(){ tone(450, 0.1, 'square', 0.04, 400); },
  tweet: function(){ tone(2200, 0.05, 'square', 0.02, 600); tone(2400, 0.05, 'square', 0.02, 500, 0.08); },
  squish: function(){ hiss(0.2, 0.07, 500); tone(140, 0.15, 'square', 0.04, -60); },
  hurt: function(){ tone(200, 0.2, 'square', 0.05, -120); },
  bonus: function(){ var n = [523, 659, 784, 1047, 1319]; for (var i = 0; i < n.length; i++) tone(n[i], 0.12, 'square', 0.05, 0, i * 0.08); },
  tick: function(){ tone(1000, 0.04, 'square', 0.03); },
  over: function(){ var n = [392, 330, 262, 196]; for (var i = 0; i < n.length; i++) tone(n[i], 0.2, 'square', 0.06, 0, i * 0.18); },
  fanfare: function(){ var n = [523, 659, 784, 1047, 784, 1047, 1319]; for (var i = 0; i < n.length; i++) tone(n[i], 0.14, 'square', 0.06, 0, i * 0.11); }
};

/* ============================================================
   SPRITES
============================================================ */
function makeSpriteP(rows, pal){
  var w = 0, i, j;
  for (i = 0; i < rows.length; i++) if (rows[i].length > w) w = rows[i].length;
  var cv = document.createElement('canvas'); cv.width = w; cv.height = rows.length;
  var x = cv.getContext('2d');
  for (j = 0; j < rows.length; j++){
    for (i = 0; i < rows[j].length; i++){
      var ch = rows[j].charAt(i);
      if (ch !== '.' && pal[ch]){ x.fillStyle = pal[ch]; x.fillRect(i, j, 1, 1); }
    }
  }
  return cv;
}
function flipC(c){
  var f = document.createElement('canvas'); f.width = c.width; f.height = c.height;
  var x = f.getContext('2d'); x.translate(c.width, 0); x.scale(-1, 1); x.drawImage(c, 0, 0);
  return f;
}
var BIRDS = (function(){
  var UP = ['....WW....HH..', '....WWW..HHEKK', '..BBBWWBBHHH..', '.BBBBBBBBBB...', 'TTBBBBBBBB....', 'T...BBBBB.....'];
  var DN = ['..........HH..', '.........HHEKK', '..BBBBBBBHHH..', '.BBBBBBBBBB...', 'TTBBWWWWBB....', 'T...WWWWB.....', '.....WW.......'];
  var kinds = [
    { B: '#f890b8', W: '#f86890', H: '#f890b8', K: '#202020', T: '#f86890', legs: true },
    { B: '#30c030', W: '#2060e0', H: '#e83020', K: '#f8d878', T: '#2060e0' },
    { B: '#e83020', W: '#2060e0', H: '#e83020', K: '#f8f0d0', T: '#f8d800' },
    { B: '#202020', W: '#202020', H: '#fcfcfc', K: '#f88818', T: '#202020' },
    { B: '#f8e030', W: '#d8b818', H: '#f8e030', K: '#f89030', T: '#d8b818' },
    { B: '#30c070', W: '#2060e0', H: '#4060f0', K: '#f86020', T: '#30c070', crest: true }
  ];
  function dress(rows, k){
    var r = rows.slice();
    if (k.crest) r.unshift('...........H..');
    if (k.legs) for (var i = 0; i < 4; i++) r.push('.....L.L......');
    return r;
  }
  var out = [];
  for (var n = 0; n < kinds.length; n++){
    var k = kinds[n], pal = { B: k.B, W: k.W, H: k.H, K: k.K, T: k.T, E: '#000000', L: k.W };
    var a = makeSpriteP(dress(UP, k), pal), b = makeSpriteP(dress(DN, k), pal);
    out.push({ col: k.B, fr: [{ r: a, l: flipC(a) }, { r: b, l: flipC(b) }] });
  }
  return out;
})();
/* ball styles: 0-2 on the beach and the clouds (make a basket and your next ball switches style),
   3-5 are the three balls lying on the gym floor */
var BALL_STYLES = [
  { n: 'CLASSIC', base: '#f07818', edge: '#b04808', seam: '#3a1a08' },
  { n: 'BEACH BALL', wedges: ['#e83020', '#fcfcfc', '#2060e0', '#f8d800'] },
  { n: 'GOLD', base: '#f8d030', edge: '#b08008', seam: '#5a3a00' },
  { n: 'LEATHER', base: '#9a5428', seam: '#3a1a08', leather: true },
  { n: 'RED WHITE BLUE', stripes: ['#d82800', '#fcfcfc', '#2038ec'] },
  { n: 'RUBBER', base: '#f87800', seam: '#201000' }
];
var BALL_IMGS = BALL_STYLES.map(function(st){
  var c = document.createElement('canvas'); c.width = 9; c.height = 9;
  var x = c.getContext('2d');
  for (var j = 0; j < 9; j++){
    for (var i = 0; i < 9; i++){
      var dx = i - 4, dy = j - 4, d = dx * dx + dy * dy, col;
      if (d > 20) continue;
      if (st.wedges) col = d <= 1 ? '#fcfcfc' : st.wedges[Math.floor((Math.atan2(dy, dx) + Math.PI) / (Math.PI / 2)) % 4];
      else if (st.stripes){ col = st.stripes[Math.floor((i + j + 20) / 2.4) % 3]; if (d > 13) col = shade(col, -0.3); }
      else {
        col = st.leather && (i + j) % 3 === 0 ? shade(st.base, -0.12) : st.base;
        if (i === 4 || j === 4 || (Math.abs(Math.abs(dx) - 3) < 0.5 && Math.abs(dy) < 3)) col = st.seam;
        else if (d > 13) col = st.edge || shade(col, -0.3);
      }
      x.fillStyle = col; x.fillRect(i, j, 1, 1);
    }
  }
  x.fillStyle = 'rgba(255,255,255,.55)'; x.fillRect(2, 2, 2, 1);
  return c;
});

/* ============================================================

============================================================ */
function newHero(x){
  return { x: x, y: FLOOR, vx: 0, vy: 0, face: 1, ground: 'floor', anim: 0, air2: true, air3: false, drop: 0, flipT: 0,
    jumpHeld: false, inv: 0, hurtT: 0, dp: 0 };

function findPlat(plats, id){ for (var i = 0; i < plats.length; i++) if (plats[i].id === id) return plats[i]; return null; }

    var g = findPlat(G.plats, p.ground);
    if (!g || p.x + 3 <= g.x1 || p.x - 3 >= g.x2){ p.ground = null; p.vy = 0; } else p.y = g.y;
  }
  if (!p.ground){
    p.vy = Math.min(p.vy + GRAV * (G.sky ? 0.88 : 1) * dt, 400);
    if (!p.jumpHeld && p.vy < -120) p.vy = -120;                       // let go of jump early = shorter hop

        var q = G.plats[i];
        if ((q.floor || p.drop <= 0) && py <= q.y + 0.5 && p.y >= q.y && p.x + 3 > q.x1 && p.x - 3 < q.x2 && (!best || q.y < best.y)) best = q;
      }

        p.y = best.y; p.vy = -p.vy * 0.42; p.air2 = true; p.air3 = G.shoe;

  if (p.ground){ p.ground = null; p.vy = -JUMP_V * G.jumpMul; p.jumpHeld = true; sfx.jump(); return; }
  if (M) p.air2 = true;                                                 // magic round: unlimited jumps
  if (!p.air2 && p.air3){ p.air3 = false; p.air2 = true; }              // Air Jordann's on the clouds: a third jump
  if (!p.air2) return;
  p.air2 = false; p.vy = -JUMP_V * 0.85; p.jumpHeld = true; p.flipT = M ? 0 : 0.3;

}
function heroDrop(p){ if (p.ground && p.ground !== 'floor'){ p.ground = null; p.drop = 0.22; p.vy = 20; } }

/* ============================================================
   BIRDS: they fly by, poop, and dive-bomb whoever bonks them with a ball
============================================================ */
function spawnBird(list){
  var dir = Math.random() < 0.5 ? 1 : -1;
  list.push({ k: pick(BIRDS), dir: dir, x: dir > 0 ? -14 : W + 14, y0: rand(14, 70), y: 0, sp: rand(30, 50), f: rand(0, 2), bob: rand(0, 6.28),
    hit: 0, mode: 'fly', vx: 0, vy: 0, t: 0, poopT: rand(1.5, 4) });
}
function birdBonk(G, b, bd){
  var cx = bd.x, cy = bd.y + 3, dx = b.x - cx, dy = b.y - cy, d = hyp(dx, dy);
  if (d > 8 || d === 0 || bd.hit > 0) return;
  var nx = dx / d, ny = dy / d, vn = b.vx * nx + b.vy * ny;
  if (vn < 0){ b.vx -= 1.7 * vn * nx; b.vy -= 1.7 * vn * ny; }
  b.x = cx + nx * 8.5; b.y = cy + ny * 8.5;
  bd.hit = 0.5;
  if (b.live) b.birdHit = true;
  burst(G.parts, cx, cy, 10, [bd.k.col, '#fcfcfc'], 45, 40, 0.8);
  tone(1500, 0.08, 'square', 0.04, -700); tone(1100, 0.08, 'square', 0.04, 500, 0.07);
  if (bd.mode === 'fly'){                                                // an angry bird dive-bombs the player
    bd.mode = 'dive'; bd.t = 0; bd.vx = bd.dir * bd.sp; bd.vy = 0;
    addPop(G.pops, cx, cy - 8, 'SQUAWK!', '#f86060');
    tone(900, 0.3, 'triangle', 0.04, -600);
  }
}
/* onStomp(bird) when you land on one; onHurt(x, text) when a diving bird or a dropping gets you */
function stepBirds(G, p, dt, onStomp, onHurt){
  var i, j;
  G.birdT -= dt;
  if (G.birdT <= 0){ spawnBird(G.birds); G.birdT = rand(6, 10); sfx.tweet(); }
  for (i = G.birds.length - 1; i >= 0; i--){
    var bd = G.birds[i];
    bd.f += dt * (bd.mode === 'fly' ? 7 : 16); bd.hit = Math.max(0, bd.hit - dt); bd.t += dt;
    if (bd.mode === 'fly'){
      bd.x += bd.dir * bd.sp * dt; bd.bob += dt * 3; bd.y = bd.y0 + Math.sin(bd.bob) * 4;
      bd.poopT -= dt;
      var overhead = Math.abs(bd.x - p.x) < 14 && bd.y < p.y - 16;
      if (bd.poopT <= 0 || (overhead && bd.poopT < 2.5)){              // birds poop now and then, and like to do it right over you
        G.poops.push({ x: bd.x, y: bd.y + 6, vy: 20 }); bd.poopT = rand(3, 6);
        tone(300, 0.08, 'square', 0.03, -200);
      }
    } else if (bd.mode === 'dive'){                                     // steers at the player for a few seconds
      var ddx = p.x - bd.x, ddy = (p.y - 6) - (bd.y + 3), dd = hyp(ddx, ddy) || 1;
      bd.vx += (ddx / dd * 90 - bd.vx) * dt * 2.5; bd.vy += (ddy / dd * 90 - bd.vy) * dt * 2.5;
      bd.x += bd.vx * dt; bd.y += bd.vy * dt;
      if (Math.abs(bd.vx) > 5) bd.dir = sgn(bd.vx);
      if (bd.t > 3) bd.mode = 'flee';
    } else { bd.x += bd.dir * 70 * dt; bd.y -= 60 * dt; }              // flies up and away
    if (bd.mode !== 'flee' && heroHit(p, bd.x, bd.y + 3, 5, 4)){
      if (p.vy > 0 && p.y - (bd.y + 3) < 4){                            // landed on top of it
        onStomp(bd);
        p.vy = -190; p.ground = null; p.air2 = true; p.jumpHeld = true;
        burst(G.parts, bd.x, bd.y + 3, 12, [bd.k.col, '#fcfcfc'], 60);
        sfx.squish();
        bd.mode = 'flee'; bd.dir = p.x < bd.x ? 1 : -1;
      } else if (bd.mode === 'dive'){
        onHurt(bd.x, 'OUCH!'); bd.mode = 'flee';
      }
    }
    if (bd.x < -20 || bd.x > W + 20 || bd.y < -20) G.birds.splice(i, 1);
  }

    var pp = G.poops[i], py = pp.y, gone = false;
    pp.vy = Math.min(160, pp.vy + 260 * dt); pp.y += pp.vy * dt;
    if (Math.abs(pp.x - p.x) < 5 && pp.y > p.y - 13 && pp.y < p.y + 1){ onHurt(pp.x, 'SPLAT!'); gone = true; }
    if (!gone){
      for (j = 0; j < G.plats.length; j++){
        var q = G.plats[j];
        if (py <= q.y && pp.y >= q.y && pp.x > q.x1 && pp.x < q.x2){ G.splats.push({ x: pp.x, y: q.y, t: 1.5 }); gone = true; break; }
      }
    }
    if (gone || pp.y > H) G.poops.splice(i, 1);
  }
  for (i = G.splats.length - 1; i >= 0; i--){ G.splats[i].t -= dt; if (G.splats[i].t <= 0) G.splats.splice(i, 1); }
}

function GymGame(){
  var G = newWorld(), hp = GYM_HOOP, p = newHero(40);
  G.left = GYM_SECS; G.hearts = 3; G.streak = 0; G.made = 0; G.noBallT = 0; G.hero = p; G.look = LOOK;
  var balls = [3, 4, 5].map(function(k, i){ return { k: k, x: 40 + i * 16, y: FLOOR - BR, vx: 0, vy: 0, rot: 0, free: true, live: false, noPick: 0, rest: 0 }; });
  p.ball = balls[0]; balls[0].free = false;
  G.balls = balls;

  function addScore(n, x, y, label){
    G.score = Math.max(0, G.score + n);
    addPop(G.pops, x, y, '+' + n, '#fcfc78');
    if (label) addPop(G.pops, x, y - 10, label, '#fcfcfc');
  }
  function shoot(){
    var b = p.ball, v = 165 + G.meter.p * 105;
    b.free = true; b.live = true; b.scored = false; b.from = p.x; b.noPick = 0.6; b.rest = 0; b.ret = false;
    b.shot = true; b.birdHit = false;                                    // a fresh shot: it either goes in or counts as a miss
    b.x = p.x + p.face * 2; b.y = p.y - 17;
    b.vx = p.face * v * Math.cos(ANG); b.vy = -v * Math.sin(ANG);
    p.ball = null; G.meter = null; G.noBallT = 0; sfx.dribble();
  }
  function grab(b){ p.ball = b; b.free = false; b.live = false; G.meter = null; G.noBallT = 0; sfx.dribble(); }
  function loseHeart(){
    G.hearts--;
    if (G.hearts <= 0 && !G.done){ G.meter = null; G.clearText = 'OUT OF HEARTS!'; G.done = true; sfx.over(); }
  }
  function onHurt(x, text){ if (hurtHero(G, p, x, text)) loseHeart(); }
  function onStomp(bd){ addScore(5, bd.x, bd.y - 6, 'STOMP!'); }

  function stepBall(b, h){
    var py = b.y, i;
    b.vy += BALL_G * h; b.x += b.vx * h; b.y += b.vy * h; b.rot += b.vx * h / BR;
    if (b.live && !b.scored && py < hp.y && b.y >= hp.y && b.x > hp.rl && b.x < hp.rr){
      b.scored = true; b.shot = false; b.ret = true; b.vx *= 0.3; G.netT = 0.5; G.made++;
      // 2 for a basket, 3 from behind the line, 5 each once you're on fire (3 in a row), 10 if it bounced off a bird and went in
      var long = Math.abs(b.from - GYM_HX) > LONG_SHOT, onFire = G.streak >= 3;
      var pts = long ? 3 : 2, label = long ? 'THREE!' : pick(['SWISH!', 'BUCKET!', 'NOTHIN NET!']);
      if (onFire){ pts = 5; label = 'ON FIRE!'; }
      if (b.birdHit){ pts = 10; label = 'BIRDIE BANK!'; }
      addScore(pts, GYM_HX, hp.y - 12, label);
      G.streak++;
      if (G.streak === 3){ addPop(G.pops, GYM_HX, hp.y - 34, 'SHOOTING STREAK!', '#f87800'); sfx.bonus(); }
      G.left += 3;
      addPop(G.pops, W / 2, 30, '+3 SEC', '#58f858');
      burst(G.parts, GYM_HX, hp.y + 4, 14, ['#f8d800', '#fcfcfc', '#58f878'], 60, 40, 0.8);
      sfx.swish();
    }
    if (b.live) for (i = 0; i < G.birds.length; i++) birdBonk(G, b, G.birds[i]);
    var posts = [hp.rl, hp.rr];
    for (i = 0; i < 2; i++){
      var px = posts[i], dx = b.x - px, dy = b.y - hp.y, d = hyp(dx, dy);
      if (d < BR + 1 && d > 0){
        var nx = dx / d, ny = dy / d, vn = b.vx * nx + b.vy * ny;
        b.x = px + nx * (BR + 1); b.y = hp.y + ny * (BR + 1);
        if (vn < 0){ b.vx -= 1.55 * vn * nx; b.vy -= 1.55 * vn * ny; if (G.rimSnd <= 0){ sfx.rim(); G.rimSnd = 0.15; } }
      }
    }
    if (b.y > hp.y - 20 - BR && b.y < hp.y + 6 + BR && b.x + BR > hp.bx && b.x < hp.bx + 2 && b.vx > 0){ b.x = hp.bx - BR; b.vx = -b.vx * 0.55; sfx.board(); }
    if (b.x < BR){ b.x = BR; b.vx = Math.abs(b.vx) * 0.5; }
    if (b.x > W - BR){ b.x = W - BR; b.vx = -Math.abs(b.vx) * 0.5; }
    if (b.vy >= 0){
      for (i = 0; i < G.plats.length; i++){
        var q = G.plats[i];
        if (py + BR <= q.y + 0.5 && b.y + BR >= q.y && b.x > q.x1 && b.x < q.x2){
          b.y = q.y - BR; b.live = false;
          if (b.shot){                                                  // landed without going in: a miss ends the streak
            b.shot = false;
            if (G.streak >= 3) addPop(G.pops, p.x, p.y - 24, 'STREAK OVER', '#f86060');
            G.streak = 0;
          }
          if (b.ret){ b.ret = false; b.vx = (p.x < b.x ? -1 : 1) * rand(40, 60); }   // made balls roll back toward you
          if (b.vy > 25){ sfx.bounce(b.vy / 3000); b.vy = -b.vy * 0.55; b.vx *= 0.85; }
          else { b.vy = 0; b.vx *= Math.pow(0.35, h); if (Math.abs(b.vx) < 2) b.vx = 0; }
          break;
        }
      }
    }
    b.rest = b.vy === 0 && b.vx === 0 ? b.rest + h : 0;
  }

  G.update = function(dt){
    var i, b;
    G.t += dt; G.left -= dt; G.netT = Math.max(0, G.netT - dt); G.rimSnd -= dt;
    var mv = (G.meter && p.ground) ? 0 : (inp.l ? -1 : (inp.r ? 1 : 0));
    p.jumpHeld = inp.a || inp.u;
    stepHero(G, p, dt, mv);
    if (G.meter){
      G.meter.p += G.meter.dir * dt / (p.ground ? 1.4 : 0.55);
      if (G.meter.p >= 1){ G.meter.p = 1; G.meter.dir = -1; } else if (G.meter.p <= 0){ G.meter.p = 0; G.meter.dir = 1; }
    }
    if (p.ball){
      b = p.ball;
      var before = Math.floor(p.dp / Math.PI);
      p.dp += dt * (p.vx ? 9 : 6);
      if (G.meter || !p.ground){ b.x = p.x + p.face * 2; b.y = p.y - 17; }
      else {
        if (Math.floor(p.dp / Math.PI) !== before) sfx.dribble();
        b.x = p.x + p.face * 6; b.y = p.y - BR - Math.abs(Math.sin(p.dp)) * 8;
        b.rot += dt * p.face * 4;
      }
    } else {
      G.noBallT += dt;
      if (p.ground) for (i = 0; i < balls.length; i++){
        b = balls[i];
        if (b.free && !b.live && b.noPick <= 0 && b.vy === 0 && Math.abs(b.x - p.x) < 8 && Math.abs(b.y + BR - p.y) < 4){ grab(b); break; }
      }
      if (!p.ball && G.noBallT > 3.5){                                  // a ball you can't reach pops back to you
        var loose = balls.filter(function(x){ return x.free && !x.live; }).sort(function(a, c){ return c.rest - a.rest; })[0];
        if (loose){ burst(G.parts, loose.x, loose.y, 8, ['#fcfcfc'], 40, 0, 0.4); grab(loose); addPop(G.pops, p.x, p.y - 22, 'NEW BALL', '#fcfcfc'); }
      }
    }
    stepBirds(G, p, dt, onStomp, onHurt);
    for (i = 0; i < balls.length; i++){
      b = balls[i];
      b.noPick = Math.max(0, b.noPick - dt);
      if (b.free) for (var s = 0; s < 3; s++) stepBall(b, dt / 3);
      if (b.live && G.streak >= 3) G.parts.push({ x: b.x + rand(-2, 2), y: b.y + rand(-2, 2), vx: rand(-10, 10), vy: rand(-20, 0), g: 0, life: 0.35, c: pick(['#f83800', '#f87800', '#f8d800']) });
    }
    stepFx(G.parts, G.pops, dt);
    if (G.left <= 0){ G.left = 0; G.meter = null; G.done = true; }
  };

  G.draw = function(v){
    gameXf(v);
    var c = v.c, y = hp.y, bx = hp.bx, i;
    c.drawImage(gymBg(), 0, 0);
    // the scoreboard: points and the clock
    c.fillStyle = '#000'; c.fillRect(100, 5, 56, 22);
    c.fillStyle = '#5a5a6a'; c.fillRect(101, 6, 54, 20);
    c.fillStyle = '#101010'; c.fillRect(103, 8, 50, 16);
    var sc = String(Math.min(999, G.score)); while (sc.length < 3) sc = '0' + sc;
    drawDigits(c, sc, 106, 13, '#f83800');
    drawDigits(c, fmt(G.left), 133, 13, '#f8d800');
    c.fillStyle = '#58f858'; for (i = 0; i < G.hearts; i++) c.fillRect(126 + i * 2, 21, 1, 1);
    // the hoop: stanchion, glass backboard, rim and net
    c.fillStyle = '#000'; c.fillRect(bx, y + 6, 4, hp.base - y - 6);
    c.fillStyle = '#a4a4b4'; c.fillRect(bx + 1, y + 6, 2, hp.base - y - 6);
    c.fillStyle = '#000'; c.fillRect(bx - 3, hp.base - 9, 11, 9);
    c.fillStyle = '#2040a8'; c.fillRect(bx - 2, hp.base - 8, 9, 8);
    c.fillStyle = '#4868d0'; c.fillRect(bx - 2, hp.base - 8, 9, 1);
    c.fillStyle = '#000'; c.fillRect(bx - 1, y - 21, 5, 28);
    c.fillStyle = '#fcfcfc'; c.fillRect(bx, y - 20, 3, 26);
    c.fillStyle = '#f83800'; c.fillRect(bx + 1, y - 8, 1, 6);
    drawNet(c, hp.rl, hp.rr, y, G.netT, 'rgba(252,252,252,.85)');
    c.fillStyle = '#000'; c.fillRect(Math.round(hp.rl) - 1, y - 1, RIM_W + 3, 4);
    c.fillStyle = '#f83800'; c.fillRect(Math.round(hp.rl), y, RIM_W + 1, 2);
    drawBirds(c, G.birds);
    drawHero(c, G.look, p, !!p.ball && (!!G.meter || !p.ground));
    if (G.meter) drawMeter(c, p.x, p.y, G.meter.p);
    for (i = 0; i < balls.length; i++) drawBall(c, balls[i].x, balls[i].y, balls[i].rot, balls[i].k);
    drawPoops(c, G.poops, G.splats);
    for (i = 0; i < 3; i++){ c.globalAlpha = i < G.hearts ? 1 : 0.25; c.drawImage(HEART, 4 + i * 9, H - 9); }
    c.globalAlpha = 1;
    drawParts(c, G.parts);
    drawPops(v, G.pops);
  };
  G.press = function(k){
    if (k === 'jump') heroJump(G, p);
    else if (k === 'drop') heroDrop(p);
    else if (k === 'shoot'){
      if (!p.ball){ addPop(G.pops, p.x, p.y - 22, 'GET A BALL', '#fcfcfc'); return; }
      var dx = GYM_HX - p.x;
      if (Math.abs(dx) < 14){ addPop(G.pops, p.x, p.y - 22, 'TOO CLOSE', '#fcfcfc'); return; }

  G.release = function(k){ if (k === 'shoot' && G.meter && p.ball) shoot(); };
  G.hud = function(){ return { balls: -1, info: G.streak >= 3 ? 'ON FIRE!' : 'BASKETS ' + G.made }; };
  return G;
}

    var slot = 21 + k * 5, tt = t + k * 9, n = Math.floor(tt / slot), u = tt - n * slot;
    var dir = skyRand(k, n) < 0.5 ? 1 : -1, cross = slot - 2 - skyRand(k + 5, n) * 4;  // a 2 to 6 second wait off screen
    var from = dir > 0 ? -RAIN_HW - 8 : W + RAIN_HW + 8, to = -from + W;

function drawCloud(c, x1, x2, y, dark){

}

var COURT_SECS = 120, COURT_BALLS = 3;

  function stepChain(dt, t){
    var M = G.magic, C = M.chain;

    if (C.fly){
      // turbo jump: a fast spinning arc to the next hoop with a rainbow trail
      var F = C.fly, k = Math.min(1, C.t / 0.55), e = k * k * (3 - 2 * k);
      var g = F.to < 3 ? hoopGeo(F.to, t, sky) : magicGeo(t), x1 = (g.rl + g.rr) / 2, y1 = g.y + 15;

    }
    var g2 = hoopGeo(C.i, t, sky);
    p.x = (g2.rl + g2.rr) / 2; p.y = g2.y + 15; p.vx = 0; p.vy = 0;
    var want = CHAIN_DIR[C.i];
    if (!inp.l && !inp.r) C.armed = true;                                 // let go of the arrow you came in with before the next one counts
    if (C.armed && ((want < 0 && inp.l) || (want > 0 && inp.r))){

  function stepMagic(dt, t){
    var M = G.magic, g = magicGeo(t), cx = (g.rl + g.rr) / 2;
    if (Math.random() < dt * 10) burst(G.parts, p.x + rand(-4, 4), p.y - rand(0, 14), 1, MAGIC_COLS, 8, -20, 0.6);
    M.msT = Math.max(0, M.msT - dt);
    if (M.chain){ stepChain(dt, t); return; }                              // the magic clock waits during the chain
    // landing after a magic shot ends the magic
    if (M.ms > 0 && p.ground){ endMagic('WHAT A SHOW!'); return; }

      var lo = hoopGeo(0, t, sky);

    }
    if (!M.dunk){
      M.left -= dt;

  G.update = function(dt){

    p.jumpHeld = inp.a || inp.u;

    if (!G.hang()) stepHero(G, p, dt, mv);

  };

============================================================ */
var inp = { l: false, r: false, u: false, d: false, a: false, b: false };
var SRC = { kb: {}, pad: {}, touch: {} };
function setKey(src, k, on){
  var s = SRC[src]; on = !!on;
  if (!!s[k] === on) return;
  s[k] = on;
  var was = inp[k], now = !!(SRC.kb[k] || SRC.pad[k] || SRC.touch[k]);

  if (now && !was) keyDown(k);

/* ============================================================
   SCREENS: title (board picker) -> intro -> play -> results
============================================================ */
var view = null, game = null, boardIdx = 0, mode = 'title', introT = 0, clearT = 0;
var panelBtns = [], panelIdx = 0, hudLast = {};
var previews = [];

function showScreen(id){
  ['scrTitle', 'scrGame'].forEach(function(s){ $(s).classList.toggle('on', s === id); });
}
function buildTitle(){
  var box = $('boards'), bs = bests();
  box.innerHTML = '';
  previews = [];
  BOARDS.forEach(function(B, i){
    var el = document.createElement('div');
    el.className = 'board' + (i === boardIdx ? ' sel' : '');
    el.innerHTML = '<canvas></canvas><div class="bNum">BOARD ' + (i + 1) + '</div><div class="bName">' + B.name + '</div>' +
      '<div class="bSub">' + B.sub + '</div><div class="bBest">BEST ' + (bs[B.id] || 0) + '</div><div class="bPlay">PLAY &#9654;</div>';
    el.onclick = function(){ ac(); boardIdx = i; startBoard(); };
    el.onmouseenter = function(){ selectBoard(i, true); };
    box.appendChild(el);
    var cv = el.querySelector('canvas');
    cv.width = W * 2; cv.height = H * 2;
    var pv = { cv: cv, c: cv.getContext('2d'), S: 2, dpr: 1 }, g = B.make();
    previews.push({ v: pv, g: g });
  });
  $('help').innerHTML = controlsText() + '<br>' + (isTouch() ? 'TAP A BOARD TO PLAY' : '&#9664; &#9654; PICK A BOARD &nbsp; SPACE OR ENTER TO PLAY') + '<br>GAME CONTROLLERS WORK TOO';
}
function selectBoard(i, quiet){
  i = (i + BOARDS.length) % BOARDS.length;
  if (i === boardIdx) return;
  boardIdx = i;
  store(SEL_KEY, i);
  var els = $('boards').children;
  for (var k = 0; k < els.length; k++) els[k].classList.toggle('sel', k === i);
  if (els[i] && els[i].scrollIntoView && !quiet) els[i].scrollIntoView({ block: 'nearest' });
  if (!quiet) sfx.tick();
}
function goTitle(){
  mode = 'title'; game = null;
  hidePanel();
  buildTitle();
  showScreen('scrTitle');
}

function showPanel(html, acts){
  var panel = $('panel');
  panel.innerHTML = html; panel.classList.remove('hide');
  panelBtns = [].slice.call(panel.querySelectorAll('button'));
  panelBtns.forEach(function(b){ b.onclick = function(){ ac(); var f = acts[b.getAttribute('data-act')]; if (f) f(); }; });
  panelIdx = 0; markSel();
}
function markSel(){ panelBtns.forEach(function(b, i){ b.classList.toggle('sel', i === panelIdx); }); }
function hidePanel(){ $('panel').classList.add('hide'); panelBtns = []; }

function startBoard(){
  var B = BOARDS[boardIdx];
  store(SEL_KEY, boardIdx);
  game = B.make();
  mode = 'intro'; introT = 4; hudLast = {};
  showScreen('scrGame');
  resize();
  showPanel('<p class="bn">BOARD ' + (boardIdx + 1) + '</p><h1>' + B.name + '</h1><p class="how">' + B.how + '</p>' +
    '<p class="tip">' + controlsText() + '</p>' +
    '<div class="row"><button data-act="go">GO! <span id="cd">4</span></button><button class="sm" data-act="menu">BOARDS</button></div>',
    { go: begin, menu: goTitle });
}
function begin(){
  if (mode !== 'intro') return;
  mode = 'play'; hidePanel();
}
function pauseGame(){
  if (mode !== 'play') return;
  mode = 'pause';
  if (game) game.meter = null;
  showPanel('<h1>PAUSED</h1><div class="row"><button data-act="resume">RESUME</button><button class="sm" data-act="again">RESTART</button><button class="sm" data-act="menu">BOARDS</button></div>',
    { resume: resume, again: startBoard, menu: goTitle });
}
function resume(){ if (mode !== 'pause') return; mode = 'play'; hidePanel(); }
function finish(){
  var B = BOARDS[boardIdx], bs = bests(), best0 = bs[B.id] || 0, sc = game.score, isBest = sc > best0;
  if (isBest){ bs[B.id] = sc; store(BEST_KEY, bs); }
  mode = 'over';
  showPanel('<p class="bn">BOARD ' + (boardIdx + 1) + ': ' + B.name + '</p><h1>' + (isBest ? 'NEW BEST!' : 'NICE!') + '</h1><p>SCORE ' + sc + '</p>' +
    '<p class="how">BEST ' + Math.max(best0, sc) + '</p><div class="row"><button data-act="again">AGAIN</button><button class="sm" data-act="menu">BOARDS</button></div>',
    { again: startBoard, menu: goTitle });
  if (isBest) sfx.fanfare();
}

function keyDown(k){
  ac();
  if (mode === 'title'){
    if (k === 'l' || k === 'u') selectBoard(boardIdx - 1);
    else if (k === 'r' || k === 'd') selectBoard(boardIdx + 1);
    else if (k === 'a' || k === 'b' || k === 'start') startBoard();
    return;
  }
  if (mode === 'play'){
    if (k === 'start' || k === 'back') pauseGame();
    else if (k === 'u' || k === 'a') game.press('jump');
    else if (k === 'd') game.press('drop');
    else if (k === 'b') game.press('shoot');
    return;
  }
  if (k === 'back'){
    if (mode === 'pause') resume();
    else if (mode === 'intro' || mode === 'over') goTitle();
    return;
  }
  if (panelBtns.length){
    if (k === 'l' || k === 'u'){ panelIdx = (panelIdx - 1 + panelBtns.length) % panelBtns.length; markSel(); sfx.tick(); }
    else if (k === 'r' || k === 'd'){ panelIdx = (panelIdx + 1) % panelBtns.length; markSel(); sfx.tick(); }
    else if (k === 'a' || k === 'b' || k === 'start') panelBtns[panelIdx].click();
  }
}
function keyUp(k){ if (mode === 'play' && k === 'b') game.release('shoot'); }

/* ---------- keyboard ---------- */
var KEYMAP = { ArrowLeft: 'l', ArrowRight: 'r', ArrowUp: 'u', ArrowDown: 'd', ' ': 'b', a: 'l', d: 'r', w: 'u', s: 'd', A: 'l', D: 'r', W: 'u', S: 'd' };
document.addEventListener('keydown', function(e){
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'Escape' || e.key === 'p' || e.key === 'P'){ e.preventDefault(); if (!e.repeat) keyDown('back'); return; }
  if (e.key === 'Enter'){ e.preventDefault(); if (!e.repeat) keyDown('start'); return; }
  var k = KEYMAP[e.key];
  if (!k) return;
  e.preventDefault();
  if (document.activeElement && document.activeElement.blur && document.activeElement !== document.body) document.activeElement.blur();
  setKey('kb', k, true);
});
document.addEventListener('keyup', function(e){ var k = KEYMAP[e.key]; if (k) setKey('kb', k, false); });
window.addEventListener('blur', function(){ for (var k in SRC.kb) setKey('kb', k, false); });

/* ---------- on-screen controller ---------- */
function bindPad(){
  var dp = $('dpad'), touches = {}, mouseDown = false;
  function dirOf(x, y){
    var r = dp.getBoundingClientRect(), dx = x - (r.left + r.width / 2), dy = y - (r.top + r.height / 2), R = r.width / 2;
    return {
      l: dx < -R * 0.2 && Math.abs(dx) > Math.abs(dy) * 0.45,
      r: dx > R * 0.2 && Math.abs(dx) > Math.abs(dy) * 0.45,
      u: dy < -R * 0.3 && Math.abs(dy) > Math.abs(dx) * 0.45,
      d: dy > R * 0.3 && Math.abs(dy) > Math.abs(dx) * 0.45
    };
  }
  function evalDirs(){
    var o = { l: false, r: false, u: false, d: false }, k;
    for (k in touches){ var t = touches[k]; o.l = o.l || t.l; o.r = o.r || t.r; o.u = o.u || t.u; o.d = o.d || t.d; }
    ['l', 'r', 'u', 'd'].forEach(function(d){ setKey('touch', d, o[d]); });
    $('dpL').className = 'dpA l' + (o.l ? ' on' : ''); $('dpR').className = 'dpA r' + (o.r ? ' on' : '');
    $('dpU').className = 'dpA u' + (o.u ? ' on' : ''); $('dpD').className = 'dpA d' + (o.d ? ' on' : '');
  }
  function tStart(e){
    e.preventDefault(); ac();
    for (var i = 0; i < e.changedTouches.length; i++){ var t = e.changedTouches[i]; touches['t' + t.identifier] = dirOf(t.clientX, t.clientY); }
    evalDirs();
  }
  function tEnd(e){
    e.preventDefault();
    for (var i = 0; i < e.changedTouches.length; i++) delete touches['t' + e.changedTouches[i].identifier];
    evalDirs();
  }
  dp.addEventListener('touchstart', tStart, { passive: false });
  dp.addEventListener('touchmove', tStart, { passive: false });
  dp.addEventListener('touchend', tEnd, { passive: false });
  dp.addEventListener('touchcancel', tEnd, { passive: false });
  dp.addEventListener('mousedown', function(e){ mouseDown = true; touches.m = dirOf(e.clientX, e.clientY); evalDirs(); });
  document.addEventListener('mousemove', function(e){ if (mouseDown){ touches.m = dirOf(e.clientX, e.clientY); evalDirs(); } });
  document.addEventListener('mouseup', function(){ if (mouseDown){ mouseDown = false; delete touches.m; evalDirs(); } });
  function bindBtn(id, key){
    var el = $(id), count = 0;
    function on(){ el.className = 'pb on'; setKey('touch', key, true); }
    function off(){ el.className = 'pb'; setKey('touch', key, false); }
    el.addEventListener('touchstart', function(e){ e.preventDefault(); ac(); count += e.changedTouches.length; if (count === e.changedTouches.length) on(); }, { passive: false });
    el.addEventListener('touchend', function(e){ e.preventDefault(); count = Math.max(0, count - e.changedTouches.length); if (!count) off(); }, { passive: false });
    el.addEventListener('touchcancel', function(e){ e.preventDefault(); count = 0; off(); }, { passive: false });
    el.addEventListener('mousedown', function(){ on(); var u = function(){ document.removeEventListener('mouseup', u); off(); }; document.addEventListener('mouseup', u); });
  }
  bindBtn('btnA', 'a');
  bindBtn('btnB', 'b');
  $('hPause').onclick = function(){ ac(); if (mode === 'play') pauseGame(); else if (mode === 'pause') resume(); };
}

/* ---------- game controller (Gamepad API, standard mapping) ---------- */
var padPrev = null;
function pollPad(){
  var list = navigator.getGamepads ? navigator.getGamepads() : [], g = null, i;
  for (i = 0; i < list.length; i++) if (list[i] && list[i].connected !== false){ g = list[i]; break; }
  var now = {};
  if (g){
    var b = function(n){ return !!(g.buttons[n] && g.buttons[n].pressed); };
    var ax = g.axes[0] || 0, ay = g.axes[1] || 0;
    now.l = b(14) || ax < -0.5; now.r = b(15) || ax > 0.5;
    now.u = b(12) || ay < -0.5; now.d = b(13) || ay > 0.5;
    now.a = b(0);                                   // A jumps
    now.b = b(1) || b(2) || b(3) || b(7);           // B, X, Y or the right trigger shoots
    now.start = b(9); now.back = b(8);
  }
  if (!padPrev){ padPrev = now; return; }           // buttons already held when the page noticed the controller don't count
  ['l', 'r', 'u', 'd', 'a', 'b'].forEach(function(k){ if (!!now[k] !== !!padPrev[k]) setKey('pad', k, now[k]); });
  if (now.start && !padPrev.start) keyDown('start');
  if (now.back && !padPrev.back) keyDown('back');
  padPrev = now;
}

/* ---------- layout ---------- */
function resize(){
  document.body.classList.toggle('land', window.innerWidth > window.innerHeight);
  document.body.classList.toggle('touch', isTouch());
  if (mode === 'title') return;
  var st = $('stage');
  if (isTouch() && window.innerWidth <= window.innerHeight){
    // phone held upright: the court across the top, the controller fills the rest
    var hudH = $('hud').offsetHeight || 40;
    fitView(view, window.innerWidth, Math.min(window.innerWidth * H / W, window.innerHeight - hudH - 200));
    st.style.height = view.ch + 'px';
  } else {
    st.style.height = '';
    fitView(view, st.clientWidth, st.clientHeight);
  }
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){ setTimeout(resize, 200); });
document.addEventListener('visibilitychange', function(){ if (document.hidden) pauseGame(); });

/* ---------- HUD ---------- */
function hud(){
  var h = game.hud(), sc = String(game.score) + ' PTS', tm = fmt(game.left), bk = h.balls + ',' + h.ballK, bh = '';
  if (sc !== hudLast.sc){ $('hScore').textContent = sc; hudLast.sc = sc; }
  if (tm !== hudLast.tm){ $('hTime').textContent = tm; hudLast.tm = tm; }
  if (h.info !== hudLast.info){ $('hInfo').textContent = h.info; hudLast.info = h.info; }
  if (bk !== hudLast.bk){
    for (var i = 0; i < h.balls && i < 8; i++) bh += '<span class="bi k' + h.ballK + '"></span>';
    $('hBalls').innerHTML = bh; hudLast.bk = bk;
  }
}

/* ---------- the loop ---------- */
var lastNow = 0;
function frame(now){
  var dt = Math.min(0.05, (now - lastNow) / 1000 || 0); lastNow = now;
  pollPad();
  if (mode === 'title'){
    // the board previews play quietly behind the title: just the scene, nobody moving
    for (var i = 0; i < previews.length; i++){ var P = previews[i]; P.g.t += dt; P.g.draw(P.v); }
  } else if (game){
    if (mode === 'play'){
      game.update(dt);
      if (game.done){ mode = 'clear'; clearT = 1.8; }
    } else if (mode === 'clear'){
      stepFx(game.parts, game.pops, dt); clearT -= dt;
      if (clearT <= 0) finish();
    } else if (mode === 'intro'){
      var before = Math.ceil(introT);
      introT -= dt;
      var cd = $('cd');
      if (cd && Math.ceil(introT) !== before){ cd.textContent = Math.max(0, Math.ceil(introT)); if (introT > 0) sfx.tick(); }
      if (introT <= 0) begin();
    }
    game.draw(view);
    if (mode === 'clear') vText(view, game.clearText, W / 2, H / 2 - 8, '#fcfc78', Math.round(nameSize(view) * 2.2));
    if (game.shake > 0 && mode === 'play'){
      var m = Math.min(1, game.shake) * 4;
      view.cv.style.transform = 'translate(' + Math.round(rand(-m, m)) + 'px,' + Math.round(rand(-m, m)) + 'px)'; view.shk = true;
    } else if (view.shk){ view.cv.style.transform = ''; view.shk = false; }
    hud();
  }
  requestAnimationFrame(frame);
}

/* ---------- start up ---------- */
view = makeView($('cv'));
boardIdx = clamp(load(SEL_KEY) | 0, 0, BOARDS.length - 1);
bindPad();
resize();
goTitle();
if (document.fonts && document.fonts.load) document.fonts.load('8px "Press Start 2P"').catch(function(){});
requestAnimationFrame(frame);
</script>
